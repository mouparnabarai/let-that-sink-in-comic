<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A3 Comic">
  <meta name="theme-color" content="#17181c">
  <title>A3 Interactive Comic Book</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="reading-stage" id="readingStage">
    <div class="comic-book" id="comicBook">

      <!-- Dynamic A3 Comic Pages Stack (populated by script.js) -->
      <div class="pages-stack" id="pagesStack"></div>

      <!-- Page Turn Canvas Overlay -->
      <canvas id="curlCanvas" class="curl-canvas"></canvas>

      <!-- Corner Drag Hotspots (Right corners = Next, Left corners = Prev) -->
      <div class="corner-grip corner-br" id="gripBR" aria-label="Drag to turn to next page"></div>
      <div class="corner-grip corner-tr" id="gripTR" aria-label="Drag to turn to next page"></div>
      <div class="corner-grip corner-bl" id="gripBL" aria-label="Drag to turn to previous page"></div>
      <div class="corner-grip corner-tl" id="gripTL" aria-label="Drag to turn to previous page"></div>

    </div><!-- /.comic-book -->
  </div><!-- /.reading-stage -->

  <script src="script.js"></script>
</body>
</html>
